<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="t d"><title id="t">LLM Gateway system architecture</title><desc id="d">An application using the OpenAI SDK points its base_url at the gateway. Inside the single Go binary a request passes gateway-key auth and rate limiting, a response cache, admission control for concurrency and token budget, a candidate resolver and a failover engine, which calls one of twelve built-in upstream providers through one OpenAI-compatible adapter. Redis holds hot-path state and the cache; Postgres is the system of record. A React admin console reads the admin and public metrics APIs.</desc><defs><style>
.bg{fill:#ffffff}
.title{font:600 28px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.sub{font:400 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.h{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#12482f}
.hd{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.hp{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a1d0e}
.s{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#3d4650}
.sp{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5a3524}
.lbl{font:500 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.it{font:italic 400 13px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#1f5a3c}
.mono{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#14181c}
.monog{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#1f6f4a}
.monop{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#9c3a18}
.stage{fill:#e4efe9;stroke:#1f6f4a;stroke-width:1.5}
.panel{fill:#f4f8f5;stroke:#1f6f4a;stroke-width:1.8}
.store{fill:#f3e9da;stroke:#9a6b23;stroke-width:1.6}
.ext{fill:#f4f2ec;stroke:#8a919b;stroke-width:1.5;stroke-dasharray:6 5}
.app{fill:#ffffff;stroke:#14181c;stroke-width:1.6}
.rej{fill:#f9ece6;stroke:#d9603a;stroke-width:1.4}
.ok{fill:#c9e2d4;stroke:#1f6f4a;stroke-width:1.4}
.note{fill:#f1eee6;stroke:#a9a395;stroke-width:1.5;stroke-dasharray:6 5}
.ar{stroke:#1f6f4a;stroke-width:2;fill:none}
.arr{stroke:#d9603a;stroke-width:1.6;fill:none}
.ard{stroke:#6b7480;stroke-width:1.8;fill:none;stroke-dasharray:5 4}
</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f6f4a" stroke-width="1.8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#d9603a" stroke-width="1.8"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7480" stroke-width="1.8"/></marker></defs><rect class="bg" x="0" y="0" width="1200" height="790"/><text x="40" y="52" class="title">LLM Gateway: system architecture</text><text x="40" y="80" class="sub">One Go binary between an OpenAI-SDK application and twelve upstream providers. Redis for the hot path, Postgres for the record.</text><rect x="40" y="165" width="200" height="112" rx="4" class="app"/><text x="140" y="196" class="hd" text-anchor="middle">Your application</text><text x="140" y="218" class="s" text-anchor="middle">OpenAI SDK</text><text x="140" y="235" class="s" text-anchor="middle">only base_url changes</text><text x="140" y="262" class="mono" text-anchor="middle">gw_live_… gateway key</text><text x="40" y="312" class="lbl">Response: SSE stream or JSON, with a</text><text x="40" y="329" class="lbl">gateway{} block (provider, model, cache,</text><text x="40" y="346" class="lbl">attempts, failovers, TTFT, duration)</text><text x="40" y="363" class="lbl">and a Server-Timing header.</text><rect x="290" y="120" width="520" height="486" rx="6" class="panel"/><text x="310" y="147" class="h">llm-gateway  ·  cmd/gateway</text><rect x="315" y="168" width="470" height="64" rx="4" class="stage"/><text x="331" y="194" class="h">RequireGatewayKey</text><text x="769" y="194" class="monop" text-anchor="end">401 / 429</text><text x="331" y="216" class="s">SHA-256 key lookup (Redis-cached) · sliding-window rate limit</text><rect x="315" y="252" width="470" height="64" rx="4" class="stage"/><text x="331" y="278" class="h">Response cache</text><text x="769" y="278" class="monop" text-anchor="end">hit → replay</text><text x="331" y="300" class="s">temperature: 0 only · epoch-keyed · a hit skips every gate below</text><rect x="315" y="336" width="470" height="64" rx="4" class="stage"/><text x="331" y="362" class="h">Admission control</text><text x="769" y="362" class="monop" text-anchor="end">429</text><text x="331" y="384" class="s">concurrency slot + daily token budget, reserved then settled</text><rect x="315" y="420" width="470" height="64" rx="4" class="stage"/><text x="331" y="446" class="h">Candidate resolver</text><text x="331" y="468" class="s">credentials · 60s key cooldown · circuit-breaker demotion</text><rect x="315" y="504" width="470" height="64" rx="4" class="stage"/><text x="331" y="530" class="h">Failover engine</text><text x="769" y="530" class="monop" text-anchor="end">502 / 503</text><text x="331" y="552" class="s">4 error categories · stream-safe · opt-in continue_on_failure</text><path d="M550 232 L550 252" class="ar" marker-end="url(#ah)"/><path d="M550 316 L550 336" class="ar" marker-end="url(#ah)"/><path d="M550 400 L550 420" class="ar" marker-end="url(#ah)"/><path d="M550 484 L550 504" class="ar" marker-end="url(#ah)"/><path d="M240 197 L316 197" class="ar" marker-end="url(#ah)"/><rect x="870" y="168" width="290" height="400" rx="4" class="ext"/><text x="1015" y="196" class="hd" text-anchor="middle">Upstream providers</text><text x="1015" y="216" class="lbl" text-anchor="middle">12 built in, one shared adapter</text><text x="900" y="256" class="mono">groq</text><text x="1035" y="256" class="mono">mistral</text><text x="900" y="286" class="mono">openrouter</text><text x="1035" y="286" class="mono">gemini</text><text x="900" y="316" class="mono">openai</text><text x="1035" y="316" class="mono">deepseek</text><text x="900" y="346" class="mono">together</text><text x="1035" y="346" class="mono">fireworks</text><text x="900" y="376" class="mono">cerebras</text><text x="1035" y="376" class="mono">xai</text><text x="900" y="406" class="mono">deepinfra</text><text x="1035" y="406" class="mono">sambanova</text><text x="1015" y="452" class="s" text-anchor="middle">Each is one registry.go entry:</text><text x="1015" y="469" class="s" text-anchor="middle">base URL + two behaviour flags.</text><text x="1015" y="506" class="lbl" text-anchor="middle">Override any base URL at runtime</text><text x="1015" y="523" class="lbl" text-anchor="middle">(how the demo points at a mock).</text><path d="M785 505 L868 505" class="ar" marker-end="url(#ah)"/><text x="826" y="497" class="monog" text-anchor="middle">SSE</text><rect x="290" y="650" width="250" height="96" rx="4" class="store"/><text x="305" y="676" class="hd">Redis</text><text x="525" y="676" class="lbl" text-anchor="end">hot path</text><text x="305" y="698" class="s">keys · rate limits · budgets · slots</text><text x="305" y="714" class="s">cooldowns · breakers · response cache</text><text x="305" y="730" class="s">hourly stats buckets</text><rect x="560" y="650" width="250" height="96" rx="4" class="store"/><text x="575" y="676" class="hd">Postgres</text><text x="795" y="676" class="lbl" text-anchor="end">system of record</text><text x="575" y="698" class="s">projects · gateway-key hashes</text><text x="575" y="714" class="s">AES-256-GCM credentials</text><text x="575" y="730" class="s">request_logs (async insert)</text><path d="M415 606 L415 648" class="ard" marker-end="url(#ad)"/><path d="M685 606 L685 648" class="ard" marker-end="url(#ad)"/><rect x="870" y="620" width="290" height="126" rx="4" class="ext"/><text x="1015" y="647" class="hd" text-anchor="middle">Admin surface</text><text x="1015" y="669" class="mono" text-anchor="middle">/admin/*  (bearer admin token)</text><text x="1015" y="686" class="mono" text-anchor="middle">/public/metrics  (no auth, CORS-gated)</text><text x="1015" y="716" class="lbl" text-anchor="middle">served by the same binary; the console</text><text x="1015" y="732" class="lbl" text-anchor="middle">is a React + Vite SPA, a pure API client</text><path d="M870 640 L840 640 L840 580 L812 580" class="ard" marker-end="url(#ad)"/></svg>
