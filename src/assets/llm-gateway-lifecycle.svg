<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 862" width="1200" height="862" role="img" aria-labelledby="t d"><title id="t">LLM Gateway request lifecycle</title><desc id="d">A chat completion request is parsed, authenticated and rate limited, looked up in the cache, then admitted by a concurrency slot and a token budget reservation before candidates are resolved. Each gate rejects with its own HTTP status. The failover engine classifies each upstream failure into one of four categories and tries the next candidate. After the response, the cache is written only for clean single-attempt answers, the budget is settled to actual usage, the concurrency slot is released and the request log is inserted asynchronously.</desc><defs><style>
.bg{fill:#ffffff}
.title{font:600 28px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.sub{font:400 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.h{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#12482f}
.hd{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.hp{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a1d0e}
.s{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#3d4650}
.sp{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5a3524}
.lbl{font:500 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.it{font:italic 400 13px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#1f5a3c}
.mono{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#14181c}
.monog{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#1f6f4a}
.monop{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#9c3a18}
.stage{fill:#e4efe9;stroke:#1f6f4a;stroke-width:1.5}
.panel{fill:#f4f8f5;stroke:#1f6f4a;stroke-width:1.8}
.store{fill:#f3e9da;stroke:#9a6b23;stroke-width:1.6}
.ext{fill:#f4f2ec;stroke:#8a919b;stroke-width:1.5;stroke-dasharray:6 5}
.app{fill:#ffffff;stroke:#14181c;stroke-width:1.6}
.rej{fill:#f9ece6;stroke:#d9603a;stroke-width:1.4}
.ok{fill:#c9e2d4;stroke:#1f6f4a;stroke-width:1.4}
.note{fill:#f1eee6;stroke:#a9a395;stroke-width:1.5;stroke-dasharray:6 5}
.ar{stroke:#1f6f4a;stroke-width:2;fill:none}
.arr{stroke:#d9603a;stroke-width:1.6;fill:none}
.ard{stroke:#6b7480;stroke-width:1.8;fill:none;stroke-dasharray:5 4}
</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f6f4a" stroke-width="1.8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#d9603a" stroke-width="1.8"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7480" stroke-width="1.8"/></marker></defs><rect class="bg" x="0" y="0" width="1200" height="862"/><text x="40" y="52" class="title">Request lifecycle: POST /v1/chat/completions</text><text x="40" y="80" class="sub">Cheapest checks first, nothing leaks on a rejection, and a cache hit consumes no concurrency slot and no budget.</text><rect x="40" y="120" width="170" height="74" rx="4" class="stage"/><text x="52" y="148" class="h">1  Parse &amp; validate</text><text x="52" y="172" class="s">before any Redis call</text><path d="M210 157 L230 157" class="ar" marker-end="url(#ah)"/><rect x="40" y="220" width="170" height="78" rx="4" class="rej"/><text x="52" y="244" class="monop">400</text><text x="52" y="264" class="sp">bad JSON, empty messages,</text><text x="52" y="280" class="sp">temperature out of range</text><path d="M125.0 194 L125.0 218" class="arr" marker-end="url(#ar)"/><rect x="230" y="120" width="170" height="74" rx="4" class="stage"/><text x="242" y="148" class="h">2  Auth + rate limit</text><text x="242" y="172" class="s">key lookup · sliding window</text><path d="M400 157 L420 157" class="ar" marker-end="url(#ah)"/><rect x="230" y="220" width="170" height="78" rx="4" class="rej"/><text x="242" y="244" class="monop">401 / 429</text><text x="242" y="264" class="sp">invalid key, or</text><text x="242" y="280" class="sp">rate_limit_exceeded</text><path d="M315.0 194 L315.0 218" class="arr" marker-end="url(#ar)"/><rect x="420" y="120" width="170" height="74" rx="4" class="stage"/><text x="432" y="148" class="h">3  Cache lookup</text><text x="432" y="172" class="s">temperature: 0 only</text><path d="M590 157 L610 157" class="ar" marker-end="url(#ah)"/><rect x="610" y="120" width="170" height="74" rx="4" class="stage"/><text x="622" y="148" class="h">4  Concurrency slot</text><text x="622" y="172" class="s">self-expiring counter</text><path d="M780 157 L800 157" class="ar" marker-end="url(#ah)"/><rect x="610" y="220" width="170" height="78" rx="4" class="rej"/><text x="622" y="244" class="monop">429</text><text x="622" y="264" class="sp">too_many_concurrent_</text><text x="622" y="280" class="sp">requests</text><path d="M695.0 194 L695.0 218" class="arr" marker-end="url(#ar)"/><rect x="800" y="120" width="170" height="74" rx="4" class="stage"/><text x="812" y="148" class="h">5  Budget reserve</text><text x="812" y="172" class="s">atomic Lua reservation</text><path d="M970 157 L990 157" class="ar" marker-end="url(#ah)"/><rect x="800" y="220" width="170" height="78" rx="4" class="rej"/><text x="812" y="244" class="monop">429 + Retry-After</text><text x="812" y="264" class="sp">daily_token_budget_</text><text x="812" y="280" class="sp">exceeded</text><path d="M885.0 194 L885.0 218" class="arr" marker-end="url(#ar)"/><rect x="990" y="120" width="170" height="74" rx="4" class="stage"/><text x="1002" y="148" class="h">6  Resolve chain</text><text x="1002" y="172" class="s">cooldowns · breakers</text><rect x="990" y="220" width="170" height="78" rx="4" class="note"/><text x="1002" y="244" class="mono">no rejection</text><text x="1002" y="264" class="s">unhealthy providers are</text><text x="1002" y="280" class="s">demoted, never removed</text><rect x="420" y="220" width="170" height="78" rx="4" class="ok"/><text x="432" y="244" class="monog">hit → replayed</text><text x="432" y="264" class="s">X-Gateway-Cache: hit,</text><text x="432" y="280" class="s">steps 4–6 never run</text><path d="M505.0 194 L505.0 218" class="ar" marker-end="url(#ah)"/><rect x="40" y="330" width="740" height="362" rx="6" class="panel"/><text x="60" y="358" class="h">Failover loop: classify the failure, record the side effect, try the next candidate</text><text x="60" y="388" class="lbl">CATEGORY</text><text x="232" y="388" class="lbl">UPSTREAM SIGNAL</text><text x="410" y="388" class="lbl">REACTION AND RECORDED SIDE EFFECT</text><rect x="52" y="402" width="716" height="54" rx="4" class="stage"/><text x="60" y="434" class="monog">KeyFault</text><text x="232" y="434" class="s">401 · 402 · 403 · 429</text><text x="410" y="426" class="s">Try next candidate.</text><text x="410" y="442" class="s">Credential excluded for 60s (cooldown).</text><rect x="52" y="464" width="716" height="54" rx="4" class="stage"/><text x="60" y="496" class="monog">ProviderTransient</text><text x="232" y="496" class="s">408 · 5xx · network</text><text x="410" y="488" class="s">Try next candidate.</text><text x="410" y="504" class="s">Counts toward the Redis-shared circuit breaker.</text><rect x="52" y="526" width="716" height="54" rx="4" class="stage"/><text x="60" y="558" class="monog">BadModel</text><text x="232" y="558" class="s">404</text><text x="410" y="550" class="s">Try next candidate.</text><text x="410" y="566" class="s">Model evicted from the provider's discovery cache.</text><rect x="52" y="588" width="716" height="54" rx="4" class="rej"/><text x="60" y="620" class="monop">NonRetryable</text><text x="232" y="620" class="s">other 4xx</text><text x="410" y="612" class="s">Abort the whole chain. Another provider cannot</text><text x="410" y="628" class="s">fix a request the client sent wrong.</text><text x="60" y="670" class="it">Mid-stream break: 502 by default. continue_on_failure (opt-in) re-prompts the next candidate to carry on.</text><rect x="810" y="330" width="350" height="362" rx="6" class="panel"/><text x="830" y="358" class="h">After the response</text><rect x="826" y="378" width="318" height="62" rx="4" class="stage"/><text x="840" y="402" class="h">Cache tap</text><text x="840" y="420" class="s">stored only if attempts == 1,</text><text x="840" y="434" class="s">finish_reason == stop, one model</text><rect x="826" y="448" width="318" height="62" rx="4" class="stage"/><text x="840" y="472" class="h">Budget settle</text><text x="840" y="490" class="s">refund or charge the reservation</text><text x="840" y="504" class="s">to actual usage</text><rect x="826" y="518" width="318" height="62" rx="4" class="stage"/><text x="840" y="542" class="h">Slot release</text><text x="840" y="560" class="s">deferred, runs on every exit path</text><rect x="826" y="588" width="318" height="62" rx="4" class="stage"/><text x="840" y="612" class="h">Log + metrics</text><text x="840" y="630" class="s">request_logs insert (async) and</text><text x="840" y="644" class="s">Prometheus observe, one defer block</text><path d="M1075.0 298 L1075.0 310 L410 310 L410 328" class="ar" marker-end="url(#ah)"/><path d="M782 511 L808 511" class="ar" marker-end="url(#ah)"/><rect x="40" y="722" width="1120" height="118" rx="4" class="note"/><text x="60" y="752" class="hd">Invariants the design protects</text><text x="60" y="778" class="s">A degraded answer is never cached. A failed-over, continued or truncated response is not stored, so it can never be replayed later as if it were the primary model's clean output.</text><text x="60" y="798" class="s">A stream with no clean finish_reason is never served as complete. It fails with an explicit error unless the caller opted in to continue_on_failure.</text><text x="60" y="818" class="s">Concurrency is acquired before budget so a budget rejection can never leak a slot; the deferred release runs regardless of which gate failed.</text></svg>
