<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d"><title id="t">FounderSales AI gateway client</title><desc id="d">callWithFallback checks that a gateway key is configured and not cooling in Redis, then sends one OpenAI-compatible request with a primary model and fallback_models to the self-hosted llm-gateway. On success it returns content, usage and the gateway-reported model. On failure classifyProviderError sorts the failure into key fault, provider transient, bad model or non-retryable. A 429 carrying a daily-budget or concurrency error code is transient rather than a key fault.</desc><defs><style>
.bg{fill:#faf8f4}
.title{font:600 28px Fraunces, Georgia, 'Times New Roman', serif;fill:#1c1a17}
.sub{font:italic 400 14px Fraunces, Georgia, 'Times New Roman', serif;fill:#5f5a50}
.h{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.s{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#3d4650}
.sm{font:400 11px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.lbl{font:500 11.5px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.cap{font:500 11px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5f5a50;letter-spacing:.06em}
.mono{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#14181c}
.monog{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#1f6f4a}
.monor{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#a0392b}
.it{font:italic 400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a4f57}
.client{fill:#e6e2f6;stroke:#8f86d0;stroke-width:1.5} .tclient{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#3e3580}
.perim{fill:#fae3e8;stroke:#c9788a;stroke-width:1.5} .tperim{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a2f42}
.app{fill:#fde9dc;stroke:#e0a070;stroke-width:1.5} .tapp{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#8a4a1a}
.async{fill:#fdefcf;stroke:#e0b64a;stroke-width:1.5} .tasync{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a5a12}
.pg{fill:#dde8f5;stroke:#8aa9d0;stroke-width:1.5} .tpg{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#2f4f7a}
.redis{fill:#e0efe3;stroke:#86b891;stroke-width:1.5} .tredis{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#2f6a3f}
.ai{fill:#f6e4d6;stroke:#d9a07a;stroke-width:1.5} .tai{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a3d14}
.ext{fill:#f3efe6;stroke:#b8b0a0;stroke-width:1.5} .text{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a4438}
.gw{fill:#e4efe9;stroke:#1f6f4a;stroke-width:1.6}
.ok{fill:#dcefe3;stroke:#5fa57b;stroke-width:1.5} .tok{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#1f5a3c}
.bad{fill:#f9e0e0;stroke:#cc7c7c;stroke-width:1.5} .tbad{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#8a2f2f}
.trans{fill:#dde9f7;stroke:#7fa3d2;stroke-width:1.5} .ttrans{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#2d4f80}
.model{fill:#e6dff6;stroke:#9a8bd0;stroke-width:1.5} .tmodel{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#45377e}
.fatal{fill:#f5d9d9;stroke:#b86060;stroke-width:1.5} .tfatal{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a2424}
.panel{fill:#ffffff;stroke:#c9c3b6;stroke-width:1.5}
.dash{fill:#f1eee6;stroke:#a9a395;stroke-width:1.5;stroke-dasharray:6 5}
.extd{fill:#f4f8f5;stroke:#1f6f4a;stroke-width:1.5;stroke-dasharray:6 5}
.ar{stroke:#6b7480;stroke-width:1.8;fill:none}
.arg{stroke:#1f6f4a;stroke-width:2;fill:none}
.arr{stroke:#c0504a;stroke-width:1.8;fill:none}
.ard{stroke:#6b7480;stroke-width:1.8;fill:none;stroke-dasharray:5 4}
.life{stroke:#b8b0a0;stroke-width:1.4;stroke-dasharray:4 5}
</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7480" stroke-width="1.8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f6f4a" stroke-width="1.8"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c0504a" stroke-width="1.8"/></marker></defs><rect class="bg" x="0" y="0" width="1200" height="800"/><text x="40" y="52" class="title">AI gateway client</text><text x="40" y="78" class="sub">callWithFallback(messages, tier): one OpenAI-compatible request, one key. Provider choice and failover happen inside llm-gateway.</text><rect x="40" y="110" width="330" height="44" rx="6" class="app"/><text x="205.0" y="134" class="tapp" text-anchor="middle">callWithFallback(messages, tier)</text><path d="M205 154 L205 182" class="ar" marker-end="url(#ah)"/><rect x="40" y="182" width="330" height="62" rx="6" class="perim"/><text x="205.0" y="206" class="tperim" text-anchor="middle">Guard</text><text x="205.0" y="226" class="s" text-anchor="middle">GATEWAY_API_KEY set?  Key cooling in Redis?</text><path d="M370 213 L430 213" class="arr" marker-end="url(#arm)"/><text x="400" y="203" class="lbl" text-anchor="middle">no</text><rect x="430" y="182" width="290" height="62" rx="6" class="fatal"/><text x="575.0" y="206" class="tfatal" text-anchor="middle">throw ALL_PROVIDERS_FAILED</text><text x="575.0" y="226" class="s" text-anchor="middle">no request sent (fail fast)</text><path d="M205 244 L205 276" class="ar" marker-end="url(#ah)"/><rect x="40" y="276" width="330" height="118" rx="6" class="app"/><text x="205" y="300" class="mono" text-anchor="middle">POST {GATEWAY_BASE_URL}/chat/completions</text><text x="205" y="324" class="s" text-anchor="middle">model: openai/gpt-oss-120b</text><text x="205" y="342" class="s" text-anchor="middle">fallback_models: mistral-large-latest, ...</text><text x="205" y="364" class="it" text-anchor="middle">with images: a vision model is the primary</text><text x="205" y="381" class="sm" text-anchor="middle">Authorization: Bearer GATEWAY_API_KEY</text><rect x="760" y="150" width="400" height="244" rx="6" class="extd"/><text x="960" y="178" class="h" text-anchor="middle">llm-gateway</text><text x="960" y="196" class="lbl" text-anchor="middle">self-hosted, own repository</text><text x="784" y="228" class="s">Resolves model aliases</text><text x="784" y="250" class="s">Walks the fallback_models chain per request</text><text x="784" y="272" class="s">Rotates and cools its own upstream provider keys</text><text x="784" y="294" class="s">Circuit breaker, stream-safe failover</text><text x="784" y="316" class="s">Twelve providers behind one endpoint</text><path d="M370 312 L758 312" class="arg" marker-end="url(#ag)"/><text x="564" y="303" class="lbl" text-anchor="middle">OpenAI-compatible request</text><path d="M758 360 L372 360" class="ard" marker-end="url(#ah)"/><text x="564" y="378" class="lbl" text-anchor="middle">JSON or SSE, plus a gateway{} block</text><path d="M205 394 L205 430" class="ar" marker-end="url(#ah)"/><rect x="40" y="430" width="330" height="62" rx="6" class="ok"/><text x="205.0" y="454" class="tok" text-anchor="middle">Success</text><text x="205.0" y="474" class="s" text-anchor="middle">content + usage + model_used</text><text x="205.0" y="490" class="s" text-anchor="middle">model_used is the gateway's own report</text><path d="M440 394 L440 430" class="arr" marker-end="url(#arm)"/><text x="452" y="416" class="lbl">non-2xx or network error</text><rect x="440" y="430" width="340" height="62" rx="6" class="panel"/><text x="610.0" y="454" class="h" text-anchor="middle">classifyProviderError(err)</text><text x="610.0" y="474" class="s" text-anchor="middle">HTTP status + parsed error.code + network code</text><path d="M610 492 L610 520 L172 520 L172 548" class="ar" marker-end="url(#ah)"/><path d="M610 492 L610 520 L477 520 L477 548" class="ar" marker-end="url(#ah)"/><path d="M610 492 L610 520 L762 520 L762 548" class="ar" marker-end="url(#ah)"/><path d="M610 492 L610 520 L1047 520 L1047 548" class="ar" marker-end="url(#ah)"/><rect x="40" y="548" width="265" height="118" rx="6" class="bad"/><text x="54" y="572" class="tbad">KEY_FAULT</text><text x="54" y="592" class="s">401 / 403, or a plain 429</text><text x="54" y="608" class="s">Cool the gateway key for an hour,</text><text x="54" y="624" class="s">shared across instances via Redis</text><rect x="325" y="548" width="265" height="118" rx="6" class="trans"/><text x="339" y="572" class="ttrans">PROVIDER_TRANSIENT</text><text x="339" y="592" class="s">5xx, network error, or a 429 with</text><text x="339" y="608" class="s">a budget / concurrency error.code</text><text x="339" y="624" class="s">Do NOT cool the key</text><rect x="610" y="548" width="265" height="118" rx="6" class="model"/><text x="624" y="572" class="tmodel">BAD_MODEL</text><text x="624" y="592" class="s">400 + a model-not-found signal</text><text x="624" y="608" class="s">Nothing to evict any more:</text><text x="624" y="624" class="s">model names are the gateway's job</text><rect x="895" y="548" width="265" height="118" rx="6" class="fatal"/><text x="909" y="572" class="tfatal">NON_RETRYABLE</text><text x="909" y="592" class="s">Anything else</text><text x="909" y="608" class="s">Presumed request-construction bug,</text><text x="909" y="624" class="s">captured to Sentry with its category</text><path d="M172 666 L172 690 L610 690" class="ar"/><path d="M477 666 L477 690 L610 690" class="ar"/><path d="M762 666 L762 690 L610 690" class="ar"/><path d="M1047 666 L1047 690 L610 690" class="ar"/><path d="M610 690 L610 706" class="ar" marker-end="url(#ah)"/><rect x="440" y="706" width="340" height="40" rx="6" class="fatal"/><text x="610.0" y="730" class="tfatal" text-anchor="middle">throw ALL_PROVIDERS_FAILED</text><rect x="40" y="742" width="330" height="44" rx="6" class="dash"/><text x="205" y="761" class="it" text-anchor="middle">No retry loop any more: one upstream, one key.</text><text x="205" y="777" class="it" text-anchor="middle">'Try the next key or provider' now lives in the gateway.</text><rect x="830" y="742" width="330" height="44" rx="6" class="dash"/><text x="995" y="761" class="it" text-anchor="middle">429 is not always a bad key: budget and concurrency</text><text x="995" y="777" class="it" text-anchor="middle">429s are capacity signals, so they never cool the key.</text></svg>