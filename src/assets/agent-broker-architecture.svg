<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d"><title id="t">Agent Broker system architecture</title><desc id="d">Multiple application processes each link the in-process agent-broker library. Every library instance talks to the same Redis through atomic Lua scripts, holding agent, budget, reservation, concurrency and circuit-breaker state. Each application also calls the downstream target directly, outside the broker.</desc><defs><style>
.bg{fill:#ffffff}
.t{font:400 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a2a1c}
.title{font:600 30px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.sub{font:400 16px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.pt{font:600 16px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a1d0e}
.ptg{font:600 16px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#12482f}
.bt{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a1d0e}
.bs{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5a3524}
.btd{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#ffffff}
.bsd{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#fbe9e0}
.it{font:italic 400 13px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#6a3a28}
.itg{font:italic 400 13px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#1f5a3c}
.lbl{font:500 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a2f14}
.lblg{font:500 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.mono{font:500 12px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#14181c}
.proc{fill:#f6c4b2;stroke:#d9603a;stroke-width:1.5}
.procdark{fill:#d95b30;stroke:#9c3a18;stroke-width:1.5}
.panel{fill:#f9ece6;stroke:#d9603a;stroke-width:1.8}
.redisp{fill:#e4efe9;stroke:#1f6f4a;stroke-width:1.8}
.redisb{fill:#c9e2d4;stroke:#1f6f4a;stroke-width:1.5}
.ext{fill:#f4f2ec;stroke:#8a919b;stroke-width:1.5;stroke-dasharray:6 5}
.note{fill:#f1eee6;stroke:#a9a395;stroke-width:1.5;stroke-dasharray:6 5}
.ar{stroke:#9c3a18;stroke-width:2}
.arg{stroke:#1f6f4a;stroke-width:2.2}
.ard{stroke:#6b7480;stroke-width:2}
</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9c3a18" stroke-width="1.8"/></marker><marker id="ah-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7480" stroke-width="1.8"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f6f4a" stroke-width="1.8"/></marker></defs><rect class="bg" width="1200" height="800"/><text x="60" y="52" class="title" text-anchor="start">Where Agent Broker sits</text><text x="60" y="82" class="sub" text-anchor="start">An in-process library per process, one shared Redis, and a downstream call the broker never touches</text><rect x="330" y="110" width="540" height="72" rx="10" class="ext"/><text x="600.0" y="141.5" class="bt" text-anchor="middle">Downstream target</text><text x="600.0" y="158.5" class="bs" text-anchor="middle">LLM provider, rate-limited API, … — external, not part of Agent Broker</text><rect x="60" y="250" width="340" height="215" rx="12" class="panel"/><text x="80" y="280" class="pt" text-anchor="start">Process A</text><rect x="80" y="298" width="300" height="58" rx="10" class="proc"/><text x="230.0" y="322.5" class="bt" text-anchor="middle">Your application code</text><text x="230.0" y="339.5" class="bs" text-anchor="middle">decides how the real call is made</text><rect x="80" y="384" width="300" height="58" rx="10" class="procdark"/><text x="230.0" y="408.5" class="btd" text-anchor="middle">agent-broker (in-process)</text><text x="230.0" y="425.5" class="bsd" text-anchor="middle">requestPermission · reportOutcome · register</text><line x1="230" y1="298" x2="400" y2="184" class="ard" stroke-dasharray="6 5" marker-end="url(#ah-d)"/><line x1="230" y1="356" x2="230" y2="384" class="ar" marker-end="url(#ah)"/><line x1="230" y1="465" x2="230" y2="545" class="arg" marker-end="url(#ah-g)"/><rect x="430" y="250" width="340" height="215" rx="12" class="panel"/><text x="450" y="280" class="pt" text-anchor="start">Process B</text><rect x="450" y="298" width="300" height="58" rx="10" class="proc"/><text x="600.0" y="322.5" class="bt" text-anchor="middle">Your application code</text><text x="600.0" y="339.5" class="bs" text-anchor="middle">decides how the real call is made</text><rect x="450" y="384" width="300" height="58" rx="10" class="procdark"/><text x="600.0" y="408.5" class="btd" text-anchor="middle">agent-broker (in-process)</text><text x="600.0" y="425.5" class="bsd" text-anchor="middle">requestPermission · reportOutcome · register</text><line x1="600" y1="298" x2="600" y2="184" class="ard" stroke-dasharray="6 5" marker-end="url(#ah-d)"/><line x1="600" y1="356" x2="600" y2="384" class="ar" marker-end="url(#ah)"/><line x1="600" y1="465" x2="600" y2="545" class="arg" marker-end="url(#ah-g)"/><rect x="800" y="250" width="340" height="215" rx="12" class="panel"/><text x="820" y="280" class="pt" text-anchor="start">Process N …</text><rect x="820" y="298" width="300" height="58" rx="10" class="proc"/><text x="970.0" y="322.5" class="bt" text-anchor="middle">Your application code</text><text x="970.0" y="339.5" class="bs" text-anchor="middle">decides how the real call is made</text><rect x="820" y="384" width="300" height="58" rx="10" class="procdark"/><text x="970.0" y="408.5" class="btd" text-anchor="middle">agent-broker (in-process)</text><text x="970.0" y="425.5" class="bsd" text-anchor="middle">requestPermission · reportOutcome · register</text><line x1="970" y1="298" x2="800" y2="184" class="ard" stroke-dasharray="6 5" marker-end="url(#ah-d)"/><line x1="970" y1="356" x2="970" y2="384" class="ar" marker-end="url(#ah)"/><line x1="970" y1="465" x2="970" y2="545" class="arg" marker-end="url(#ah-g)"/><text x="612" y="222" class="lblg" text-anchor="start">caller's own direct call — outside the broker's awareness</text><text x="612" y="512" class="lbl" text-anchor="start">Lua scripts: atomic check-and-reserve</text><rect x="60" y="545" width="1080" height="150" rx="12" class="redisp"/><text x="80" y="574" class="ptg" text-anchor="start">Redis — the one thing every process actually shares</text><rect x="80" y="590" width="196" height="82" rx="10" class="redisb"/><text x="178.0" y="618.0" class="bt" text-anchor="middle">Agent tree</text><text x="178.0" y="635.0" class="bs" text-anchor="middle">agent:{id} hash</text><text x="178.0" y="652.0" class="bs" text-anchor="middle">depth · rootId · budgetKey · TTL</text><rect x="288" y="590" width="196" height="82" rx="10" class="redisb"/><text x="386.0" y="618.0" class="bt" text-anchor="middle">Budget pools</text><text x="386.0" y="635.0" class="bs" text-anchor="middle">budget:{budgetKey} integer</text><text x="386.0" y="652.0" class="bs" text-anchor="middle">shared only by explicit key</text><rect x="496" y="590" width="196" height="82" rx="10" class="redisb"/><text x="594.0" y="618.0" class="bt" text-anchor="middle">Reservations</text><text x="594.0" y="635.0" class="bs" text-anchor="middle">reservation:{id} hash + TTL</text><text x="594.0" y="652.0" class="bs" text-anchor="middle">reservations:expiring (zset)</text><rect x="704" y="590" width="196" height="82" rx="10" class="redisb"/><text x="802.0" y="618.0" class="bt" text-anchor="middle">Concurrency</text><text x="802.0" y="635.0" class="bs" text-anchor="middle">in-flight counter per</text><text x="802.0" y="652.0" class="bs" text-anchor="middle">(target, budgetKey) pair</text><rect x="912" y="590" width="196" height="82" rx="10" class="redisb"/><text x="1010.0" y="618.0" class="bt" text-anchor="middle">Circuit breaker</text><text x="1010.0" y="635.0" class="bs" text-anchor="middle">circuit:{target} failure zset</text><text x="1010.0" y="652.0" class="bs" text-anchor="middle">+ :state (open, or absent)</text><rect x="60" y="715" width="1080" height="68" rx="10" class="note"/><text x="80" y="740" class="pt" text-anchor="start">Why this shape</text><text x="80" y="760" class="it" text-anchor="start">Cross-process coordination comes from the shared Redis state, not from a broker service — there is nothing extra to deploy. The broker never</text><text x="80" y="776" class="it" text-anchor="start">sits in the request path, so it only learns about a call's result from what reportOutcome reports.</text></svg>
