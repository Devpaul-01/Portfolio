</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7480" stroke-width="1.8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f6f4a" stroke-width="1.8"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c0504a" stroke-width="1.8"/></marker></defs><rect class="bg" x="0" y="0" width="1215" height="1000"/><text x="32" y="52" class="title">FounderSales: system architecture</text><text x="32" y="76" class="sub">Node.js/Express backend, layered routes to services to Supabase, with every AI call going through one self-hosted gateway</text><rect x="32" y="108" width="852" height="112" rx="8" class="panel"/><text x="48" y="132" class="cap">CLIENT</text><rect x="48" y="144" width="322" height="62" rx="6" class="client"/><text x="62" y="168" class="tclient">Frontend SPA</text><text x="62" y="188" class="s">HTTPS / JSON</text><path d="M458 220 L458 262" class="ar" marker-end="url(#ah)"/><rect x="32" y="262" width="852" height="190" rx="8" class="panel"/><text x="48" y="286" class="cap">API PROCESS: app.js (Express)</text><rect x="48" y="298" width="268" height="62" rx="6" class="perim"/><text x="62" y="322" class="tperim">helmet · cors</text><text x="62" y="342" class="s">morgan logging · 2mb body cap</text><rect x="330" y="298" width="268" height="62" rx="6" class="perim"/><text x="344" y="322" class="tperim">authenticate</text><text x="344" y="342" class="s">Supabase JWT verify, 30s cached profile</text><rect x="612" y="298" width="256" height="62" rx="6" class="perim"/><text x="626" y="322" class="tperim">resolveWorkspace</text><text x="626" y="342" class="s">active membership, 30s cached ctx</text><text x="458" y="377" class="lbl" text-anchor="middle">19 route-specific rate limiters, one per cost profile</text><rect x="48" y="386" width="400" height="54" rx="6" class="app"/><text x="62" y="410" class="tapp">Routes → Controllers</text><text x="62" y="430" class="s">Zod validation, response shaping</text><rect x="462" y="386" width="406" height="54" rx="6" class="app"/><text x="476" y="410" class="tapp">Services</text><text x="476" y="430" class="s">the only layer that touches data, AI orchestration included</text><path d="M458 452 L458 494" class="ar" marker-end="url(#ah)"/><rect x="32" y="494" width="852" height="158" rx="8" class="panel"/><text x="48" y="518" class="cap">ASYNCHRONOUS PROCESSING: BullMQ, Redis-backed, own process or in-process</text><rect x="48" y="530" width="268" height="110" rx="6" class="async"/><text x="62" y="554" class="tasync">scheduledWorker.js</text><text x="62" y="574" class="s">21 cron-registered jobs</text><text x="62" y="590" class="s">concurrency 1 · 10 min lock</text><text x="62" y="606" class="s">self-enqueues for chained work</text><rect x="330" y="530" width="268" height="110" rx="6" class="async"/><text x="344" y="554" class="tasync">practiceWorker.js</text><text x="344" y="574" class="s">event-driven, delayed follow-up</text><text x="344" y="590" class="s">concurrency 10</text><text x="344" y="606" class="s">ticks, skill scoring, annotations</text><rect x="612" y="530" width="256" height="110" rx="6" class="async"/><text x="626" y="554" class="tasync">backgroundWorker.js</text><text x="626" y="574" class="s">durable fire-and-forget</text><text x="626" y="590" class="s">concurrency 5</text><text x="626" y="606" class="s">calendar prep, voice memos, dedup</text><path d="M458 652 L458 694" class="ar" marker-end="url(#ah)"/><rect x="32" y="694" width="852" height="118" rx="8" class="panel"/><text x="48" y="718" class="cap">DATA &amp; INFRA</text><rect x="48" y="730" width="268" height="70" rx="6" class="pg"/><text x="62" y="754" class="tpg">Postgres</text><text x="62" y="774" class="s">via Supabase, service-role client</text><rect x="330" y="730" width="268" height="70" rx="6" class="redis"/><text x="344" y="754" class="tredis">Redis</text><text x="344" y="774" class="s">queues · cache · rate limits · cooldown</text><rect x="612" y="730" width="256" height="70" rx="6" class="ext"/><text x="626" y="754" class="text">Cloudinary</text><text x="626" y="774" class="s">file storage: voice memos, uploads</text><rect x="908" y="108" width="276" height="330" rx="8" class="panel"/><text x="924" y="134" class="cap">AI LAYER</text><rect x="922" y="148" width="248" height="120" rx="6" class="gw"/><text x="936" y="174" class="h">llm-gateway</text><text x="936" y="194" class="s">self-hosted, own repo</text><text x="936" y="211" class="s">OpenAI-compatible endpoint</text><text x="936" y="228" class="s">one project key in</text><text x="936" y="245" class="s">many providers behind it</text><rect x="922" y="290" width="248" height="64" rx="6" class="ai"/><text x="936" y="314" class="tai">Groq Whisper</text><text x="936" y="332" class="s">called directly, voice-memo</text><text x="936" y="348" class="s">transcription only</text><text x="924" y="380" class="it">Every chat and generation call is one</text><text x="924" y="396" class="it">request to the gateway. Failover is</text><text x="924" y="412" class="it">its job. See the gateway-client diagram.</text><path d="M868 413 L908 413" class="ar" marker-end="url(#ah)"/><rect x="908" y="462" width="276" height="350" rx="8" class="panel"/><text x="924" y="488" class="cap">EXTERNAL SERVICES</text><rect x="922" y="508" width="248" height="60" rx="6" class="ext"/><text x="936" y="532" class="text">Exa</text><text x="936" y="552" class="s">web search</text><rect x="922" y="578" width="248" height="60" rx="6" class="ext"/><text x="936" y="602" class="text">Firebase Cloud Messaging</text><text x="936" y="622" class="s">push notifications</text><rect x="922" y="648" width="248" height="60" rx="6" class="ext"/><text x="936" y="672" class="text">Resend / SMTP</text><text x="936" y="692" class="s">email digests</text><rect x="922" y="718" width="248" height="60" rx="6" class="ext"/><text x="936" y="742" class="text">Sentry</text><text x="936" y="762" class="s">error tracking, all processes</text><rect x="32" y="832" width="1152" height="104" rx="6" class="dash"/><text x="48" y="858" class="h">Why this shape, not microservices</text><text x="48" y="878" class="s">The domain (a person's product context, outreach history, practice performance, calendar) is a small number of tightly related entities with</text><text x="48" y="895" class="s">cross-cutting AI concerns, cheaper to share as one process's library code than to split across service boundaries.</text><text x="48" y="922" class="it">The one genuine seam is synchronous requests vs asynchronous work. The combined process (app.js) is the default; the split topology is wired too.</text><rect x="32" y="962" width="14" height="14" rx="3" class="client"/><text x="52" y="974" class="sm">Client</text><rect x="115.6" y="962" width="14" height="14" rx="3" class="perim"/><text x="135.6" y="974" class="sm">Perimeter / auth</text><rect x="265.2" y="962" width="14" height="14" rx="3" class="app"/><text x="285.2" y="974" class="sm">Application layer</text><rect x="421.4" y="962" width="14" height="14" rx="3" class="async"/><text x="441.4" y="974" class="sm">Async / jobs</text><rect x="544.5999999999999" y="962" width="14" height="14" rx="3" class="pg"/><text x="564.5999999999999" y="974" class="sm">Postgres</text><rect x="641.3999999999999" y="962" width="14" height="14" rx="3" class="redis"/><text x="661.3999999999999" y="974" class="sm">Redis</text><rect x="718.3999999999999" y="962" width="14" height="14" rx="3" class="gw"/><text x="738.3999999999999" y="974" class="sm">AI gateway</text><rect x="828.3999999999999" y="962" width="14" height="14" rx="3" class="ext"/><text x="848.3999999999999" y="974" class="sm">External / structural</text></svg>