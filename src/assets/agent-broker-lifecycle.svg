<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d"><title id="t">Agent Broker request lifecycle</title><desc id="d">A request passes through one atomic admission script that checks agent existence, circuit state, budget and concurrency and then reserves. The caller makes its own downstream call, then reports the outcome to a second atomic script that reconciles budget, releases concurrency and updates the circuit. Abandoned reservations are resolved by a lazy sweep through the same second script.</desc><defs><style>
.bg{fill:#ffffff}
.t{font:400 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a2a1c}
.title{font:600 30px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.sub{font:400 16px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.pt{font:600 16px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a1d0e}
.ptg{font:600 16px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#12482f}
.bt{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a1d0e}
.bs{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5a3524}
.btd{font:600 15px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#ffffff}
.bsd{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#fbe9e0}
.it{font:italic 400 13px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#6a3a28}
.itg{font:italic 400 13px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#1f5a3c}
.lbl{font:500 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a2f14}
.lblg{font:500 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.mono{font:500 12px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#14181c}
.proc{fill:#f6c4b2;stroke:#d9603a;stroke-width:1.5}
.procdark{fill:#d95b30;stroke:#9c3a18;stroke-width:1.5}
.panel{fill:#f9ece6;stroke:#d9603a;stroke-width:1.8}
.redisp{fill:#e4efe9;stroke:#1f6f4a;stroke-width:1.8}
.redisb{fill:#c9e2d4;stroke:#1f6f4a;stroke-width:1.5}
.ext{fill:#f4f2ec;stroke:#8a919b;stroke-width:1.5;stroke-dasharray:6 5}
.note{fill:#f1eee6;stroke:#a9a395;stroke-width:1.5;stroke-dasharray:6 5}
.ar{stroke:#9c3a18;stroke-width:2}
.arg{stroke:#1f6f4a;stroke-width:2.2}
.ard{stroke:#6b7480;stroke-width:2}
</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9c3a18" stroke-width="1.8"/></marker><marker id="ah-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7480" stroke-width="1.8"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f6f4a" stroke-width="1.8"/></marker></defs><rect class="bg" width="1200" height="840"/><text x="60" y="52" class="title" text-anchor="start">One request, two atomic steps</text><text x="60" y="82" class="sub" text-anchor="start">Each step is a single Redis Lua script — no read-then-write gap for another process to slip into</text><rect x="60" y="110" width="1080" height="225" rx="12" class="panel"/><text x="80" y="140" class="pt" text-anchor="start">①  requestPermission — one EVALSHA (REQUEST_PERMISSION)</text><rect x="80" y="160" width="196" height="92" rx="10" class="proc"/><text x="178.0" y="201.5" class="bt" text-anchor="middle">Agent exists?</text><text x="178.0" y="218.5" class="bs" text-anchor="middle">else unknown_agent</text><line x1="276" y1="206" x2="288" y2="206" class="ar" marker-end="url(#ah)"/><rect x="288" y="160" width="196" height="92" rx="10" class="proc"/><text x="386.0" y="193.0" class="bt" text-anchor="middle">Circuit state</text><text x="386.0" y="210.0" class="bs" text-anchor="middle">open → deny, unless the</text><text x="386.0" y="227.0" class="bs" text-anchor="middle">probe draw admits it</text><line x1="484" y1="206" x2="496" y2="206" class="ar" marker-end="url(#ah)"/><rect x="496" y="160" width="196" height="92" rx="10" class="proc"/><text x="594.0" y="193.0" class="bt" text-anchor="middle">Budget ≥ cost?</text><text x="594.0" y="210.0" class="bs" text-anchor="middle">a missing pool reads as 0</text><text x="594.0" y="227.0" class="bs" text-anchor="middle">else budget_exceeded</text><line x1="692" y1="206" x2="704" y2="206" class="ar" marker-end="url(#ah)"/><rect x="704" y="160" width="196" height="92" rx="10" class="proc"/><text x="802.0" y="193.0" class="bt" text-anchor="middle">Concurrency &lt; limit?</text><text x="802.0" y="210.0" class="bs" text-anchor="middle">per (target, budgetKey)</text><text x="802.0" y="227.0" class="bs" text-anchor="middle">else concurrency_exceeded</text><line x1="900" y1="206" x2="912" y2="206" class="ar" marker-end="url(#ah)"/><rect x="912" y="160" width="196" height="92" rx="10" class="procdark"/><text x="1010.0" y="193.0" class="btd" text-anchor="middle">Reserve</text><text x="1010.0" y="210.0" class="bsd" text-anchor="middle">DECRBY budget · INCR counter</text><text x="1010.0" y="227.0" class="bsd" text-anchor="middle">HSET reservation · ZADD expiry</text><text x="80" y="282" class="it" text-anchor="start">Checked in this order. Nothing is written on any denial path.</text><text x="80" y="302" class="it" text-anchor="start">Past the soft failure threshold a call is still admitted, with a retryAfter hint attached.</text><line x1="600" y1="335" x2="600" y2="372" class="ar" marker-end="url(#ah)"/><rect x="330" y="372" width="540" height="64" rx="10" class="ext"/><text x="600.0" y="399.5" class="bt" text-anchor="middle">Caller makes its own downstream call</text><text x="600.0" y="416.5" class="bs" text-anchor="middle">outside the broker — it learns the result only via reportOutcome</text><line x1="600" y1="436" x2="600" y2="470" class="ar" marker-end="url(#ah)"/><rect x="60" y="470" width="1080" height="225" rx="12" class="panel"/><text x="80" y="500" class="pt" text-anchor="start">②  reportOutcome — one EVALSHA (RESOLVE_RESERVATION)</text><rect x="80" y="520" width="196" height="92" rx="10" class="proc"/><text x="178.0" y="553.0" class="bt" text-anchor="middle">Already resolved?</text><text x="178.0" y="570.0" class="bs" text-anchor="middle">yes → no-op</text><text x="178.0" y="587.0" class="bs" text-anchor="middle">(idempotent)</text><line x1="276" y1="566" x2="288" y2="566" class="ar" marker-end="url(#ah)"/><rect x="288" y="520" width="196" height="92" rx="10" class="proc"/><text x="386.0" y="553.0" class="bt" text-anchor="middle">Reconcile budget</text><text x="386.0" y="570.0" class="bs" text-anchor="middle">refund = estimated − actual</text><text x="386.0" y="587.0" class="bs" text-anchor="middle">an overrun deducts further</text><line x1="484" y1="566" x2="496" y2="566" class="ar" marker-end="url(#ah)"/><rect x="496" y="520" width="196" height="92" rx="10" class="proc"/><text x="594.0" y="553.0" class="bt" text-anchor="middle">Release</text><text x="594.0" y="570.0" class="bs" text-anchor="middle">DECR concurrency · mark</text><text x="594.0" y="587.0" class="bs" text-anchor="middle">resolved · ZREM expiry</text><line x1="692" y1="566" x2="704" y2="566" class="ar" marker-end="url(#ah)"/><rect x="704" y="520" width="196" height="92" rx="10" class="proc"/><text x="802.0" y="553.0" class="bt" text-anchor="middle">Retryable failure?</text><text x="802.0" y="570.0" class="bs" text-anchor="middle">ZADD to failure window;</text><text x="802.0" y="587.0" class="bs" text-anchor="middle">open at hardThreshold</text><line x1="900" y1="566" x2="912" y2="566" class="ar" marker-end="url(#ah)"/><rect x="912" y="520" width="196" height="92" rx="10" class="proc"/><text x="1010.0" y="553.0" class="bt" text-anchor="middle">Probe succeeded?</text><text x="1010.0" y="570.0" class="bs" text-anchor="middle">close circuit and</text><text x="1010.0" y="587.0" class="bs" text-anchor="middle">clear the failure window</text><text x="80" y="642" class="it" text-anchor="start">A success with no actualCost is settled at the reserved estimate and flagged costUnknown.</text><text x="80" y="662" class="it" text-anchor="start">A failure with no actualCost refunds the whole reservation.</text><line x1="320" y1="740" x2="320" y2="697" class="ar" marker-end="url(#ah)"/><text x="332" y="722" class="lbl" text-anchor="start">same script</text><rect x="60" y="740" width="520" height="86" rx="10" class="ext"/><text x="80" y="764" class="pt" text-anchor="start">Abandoned reservation (caller never reported)</text><text x="80" y="786" class="it" text-anchor="start">A lazy sweep inside the next requestPermission resolves it through</text><text x="80" y="804" class="it" text-anchor="start">the same script — as a failure, full refund, never counted toward the circuit.</text><rect x="620" y="740" width="520" height="86" rx="10" class="note"/><text x="640" y="764" class="pt" text-anchor="start">Why this shape</text><text x="640" y="786" class="it" text-anchor="start">One place closes a reservation, so a single idempotency check</text><text x="640" y="804" class="it" text-anchor="start">covers reportOutcome racing the sweep (see cleanup.test.ts).</text></svg>
