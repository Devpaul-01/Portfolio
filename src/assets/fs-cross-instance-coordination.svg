<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">FounderSales cross-instance gateway-key cooldown</title><desc id="d">Instance 1 receives a 401 from the gateway and writes a cooldown hash for the gateway key to Redis with a one hour expiry. Instance 2 later checks the same Redis key before a new request, finds the cooldown, and fails fast without sending a request to the gateway.</desc><defs><style>
.bg{fill:#faf8f4}
.title{font:600 28px Fraunces, Georgia, 'Times New Roman', serif;fill:#1c1a17}
.sub{font:italic 400 14px Fraunces, Georgia, 'Times New Roman', serif;fill:#5f5a50}
.h{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#14181c}
.s{font:400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#3d4650}
.sm{font:400 11px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.lbl{font:500 11.5px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5b6470}
.cap{font:500 11px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#5f5a50;letter-spacing:.06em}
.mono{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#14181c}
.monog{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#1f6f4a}
.monor{font:500 11.5px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;fill:#a0392b}
.it{font:italic 400 12px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a4f57}
.client{fill:#e6e2f6;stroke:#8f86d0;stroke-width:1.5} .tclient{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#3e3580}
.perim{fill:#fae3e8;stroke:#c9788a;stroke-width:1.5} .tperim{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a2f42}
.app{fill:#fde9dc;stroke:#e0a070;stroke-width:1.5} .tapp{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#8a4a1a}
.async{fill:#fdefcf;stroke:#e0b64a;stroke-width:1.5} .tasync{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a5a12}
.pg{fill:#dde8f5;stroke:#8aa9d0;stroke-width:1.5} .tpg{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#2f4f7a}
.redis{fill:#e0efe3;stroke:#86b891;stroke-width:1.5} .tredis{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#2f6a3f}
.ai{fill:#f6e4d6;stroke:#d9a07a;stroke-width:1.5} .tai{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a3d14}
.ext{fill:#f3efe6;stroke:#b8b0a0;stroke-width:1.5} .text{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#4a4438}
.gw{fill:#e4efe9;stroke:#1f6f4a;stroke-width:1.6}
.ok{fill:#dcefe3;stroke:#5fa57b;stroke-width:1.5} .tok{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#1f5a3c}
.bad{fill:#f9e0e0;stroke:#cc7c7c;stroke-width:1.5} .tbad{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#8a2f2f}
.trans{fill:#dde9f7;stroke:#7fa3d2;stroke-width:1.5} .ttrans{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#2d4f80}
.model{fill:#e6dff6;stroke:#9a8bd0;stroke-width:1.5} .tmodel{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#45377e}
.fatal{fill:#f5d9d9;stroke:#b86060;stroke-width:1.5} .tfatal{font:600 14px Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#7a2424}
.panel{fill:#ffffff;stroke:#c9c3b6;stroke-width:1.5}
.dash{fill:#f1eee6;stroke:#a9a395;stroke-width:1.5;stroke-dasharray:6 5}
.extd{fill:#f4f8f5;stroke:#1f6f4a;stroke-width:1.5;stroke-dasharray:6 5}
.ar{stroke:#6b7480;stroke-width:1.8;fill:none}
.arg{stroke:#1f6f4a;stroke-width:2;fill:none}
.arr{stroke:#c0504a;stroke-width:1.8;fill:none}
.ard{stroke:#6b7480;stroke-width:1.8;fill:none;stroke-dasharray:5 4}
.life{stroke:#b8b0a0;stroke-width:1.4;stroke-dasharray:4 5}
</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7480" stroke-width="1.8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f6f4a" stroke-width="1.8"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c0504a" stroke-width="1.8"/></marker></defs><rect class="bg" x="0" y="0" width="1200" height="640"/><text x="40" y="52" class="title">Cross-instance gateway-key cooldown</text><text x="40" y="78" class="sub">One instance learns the gateway key is being rejected. Every other instance already knows, with no wasted request.</text><rect x="120" y="110" width="180" height="44" rx="6" class="app"/><text x="210" y="138" class="tapp" text-anchor="middle">Instance 1</text><path d="M210 154 L210 560" class="life"/><rect x="510" y="110" width="180" height="44" rx="6" class="redis"/><text x="600" y="138" class="tredis" text-anchor="middle">Redis</text><path d="M600 154 L600 560" class="life"/><rect x="900" y="110" width="180" height="44" rx="6" class="app"/><text x="990" y="138" class="tapp" text-anchor="middle">Instance 2</text><path d="M990 154 L990 560" class="life"/><rect x="60" y="178" width="300" height="52" rx="5" class="bad"/><text x="210" y="198" class="s" text-anchor="middle">The gateway returns 401</text><text x="210" y="216" class="s" text-anchor="middle">(the key is being rejected)</text><path d="M210 262 L598 262" class="arr" marker-end="url(#arm)"/><text x="405.0" y="250" class="mono" text-anchor="middle">HSET mp:cooldown:gateway:0</text><text x="405.0" y="282" class="mono" text-anchor="middle">{failCount, failedAt}  EX 3600</text><rect x="450" y="306" width="300" height="54" rx="5" class="redis"/><text x="600" y="328" class="tredis" text-anchor="middle">Shared cooldown state</text><text x="600" y="346" class="sm" text-anchor="middle">one slot: provider=gateway, keyIndex=0</text><rect x="840" y="386" width="300" height="52" rx="5" class="panel"/><text x="990" y="406" class="s" text-anchor="middle">callWithFallback() for</text><text x="990" y="424" class="s" text-anchor="middle">a brand new request</text><path d="M990 462 L602 462" class="ar" marker-end="url(#ah)"/><text x="795.0" y="452" class="mono" text-anchor="middle">is mp:cooldown:gateway:0 set?</text><path d="M600 496 L988 496" class="ard" marker-end="url(#ah)"/><text x="795.0" y="488" class="mono" text-anchor="middle">yes: {failCount: 1, failedAt: ...}</text><rect x="840" y="508" width="300" height="52" rx="5" class="ok"/><text x="990" y="528" class="s" text-anchor="middle">Fail fast: no request sent,</text><text x="990" y="546" class="s" text-anchor="middle">no wasted 401</text><rect x="40" y="586" width="1120" height="40" rx="6" class="dash"/><text x="600" y="604" class="it" text-anchor="middle">The same providerCooldown.js module serves Exa search keys. Budget and concurrency 429s never write a cooldown.</text><text x="600" y="620" class="it" text-anchor="middle">MULTIPROVIDER_REDIS_STATE_ENABLED=false reverts the AI layer to in-memory cooldown state with no deploy.</text></svg>